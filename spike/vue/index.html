<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch UI · Vue 3 spike harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ui-bg-main);
      }
      #stage {
        min-height: 100vh;
        background: var(--ui-bg-main);
      }
      /* Harness-only sizing. Arbitrary Tailwind values used by the harness are
         not in the prebuilt library CSS (it only scans library/components). */
      .spike-modal {
        width: 420px;
      }
      .spike-modal--narrow {
        width: 300px;
      }
    </style>
  </head>
  <body>
    <!-- Each framework is mounted here alone, then measured, then unmounted. -->
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
